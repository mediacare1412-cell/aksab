<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مبروك!</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: system-ui, sans-serif;
        }
        body {
            background: linear-gradient(135deg, #11998e, #38ef7d);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .card {
            background: white;
            border-radius: 20px;
            padding: 50px 30px;
            max-width: 500px;
            width: 100%;
            text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: fadeIn 0.5s ease;
        }
        h1 {
            color: #333;
            margin-bottom: 20px;
            font-size: 32px;
        }
        .tick {
            font-size: 80px;
            color: #4caf50;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            color: #666;
            margin-bottom: 20px;
        }
        .highlight {
            font-size: 24px;
            font-weight: bold;
            color: #11998e;
        }
        .btn {
            background: #11998e;
            color: white;
            border: none;
            border-radius: 10px;
            padding: 15px 40px;
            font-size: 18px;
            cursor: pointer;
            margin-top: 30px;
        }
        .btn:hover {
            background: #0e7c72;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="tick">🎉</div>
        <h1>مبروك كسبت! 🎁</h1>
        <p>تهانينا! لقد فزت 35 دولار.</p>
        <p class="highlight">انتظر رسالتنا خلال 5 إلى 10 دقائق</p>
        <p>سيتم التواصل معك عبر الواتساب أو الهاتف</p>
        <button class="btn" onclick="window.location.href='index.html'">العودة للصفحة الرئيسية</button>
    </div>
</body>
</html>
